services:
  # -------------------------
  # DATABASES & CACHES
  # -------------------------
  catalog-postgres-db: 
    image: postgres:latest
    networks:
      - catalog-network 
      - eshop-network

  basket-postgres-db: 
    image: postgres:latest
    networks:
      - basket-network 

  basket-redis-cache: 
    image: redis:latest
    networks:
      - basket-network 

  ordering-sql-server-db: 
    image: mcr.microsoft.com/mssql/server:2019-latest
    networks:
      - ordering-network

  # -------------------------
  # APIs
  # -------------------------
  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: ./services/catalog/Catalog.API/Dockerfile
    networks:
      - catalog-network 

  basket.api:
    image: ${DOCKER_REGISTRY-}basketapi
    build:
      context: .
      dockerfile: services/basket/Basket.API/Dockerfile
    networks:
      - basket-network 
      - eshop-network

  discount.grpc:
    image: ${DOCKER_REGISTRY-}discountgrpc
    build:
      context: .
      dockerfile: services/discount/Discount.Grpc/Dockerfile
    networks:
      - eshop-network

# -------------------------
# VOLUMES & NETWORKS
# -------------------------
volumes:
  catalog-postgres:  
  basket-postgres:  
  # discount-sqlite:  

networks:
  eshop-network:
    driver: bridge
  catalog-network:
    driver: bridge
  basket-network:
    driver: bridge
  ordering-network:
    driver: bridge